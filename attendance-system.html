function pad(n){ return n<10?"0"+n:""+n; }
function fmtDate(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayStr(){ return fmtDate(new Date()); }
function nowTimeStr(){ const d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds()); }
function niceTime(t){ if(!t) return "—"; const [h,m]=t.split(":"); const hh=parseInt(h,10); const ap=hh>=12?"PM":"AM"; const h12=((hh%12)||12); return h12+":"+m+" "+ap; }
function uid(prefix){ return prefix+"_"+Math.random().toString(36).slice(2,9); }
function resizeImageFile(file, maxDim){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let {width,height} = img;
        if(width>height){ if(width>maxDim){ height=Math.round(height*maxDim/width); width=maxDim; } }
        else { if(height>maxDim){ width=Math.round(width*maxDim/height); height=maxDim; } }
        const canvas = document.createElement("canvas");
        canvas.width=width; canvas.height=height;
        canvas.getContext("2d").drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL("image/jpeg",0.82));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function minutesBetween(t1,t2){
  const [h1,m1]=t1.split(":").map(Number), [h2,m2]=t2.split(":").map(Number);
  return (h2*60+m2)-(h1*60+m1);
}
function fmtHM(mins){ if(mins<0) mins=0; const h=Math.floor(mins/60), m=mins%60; return h+"h "+m+"m"; }

function seedAttendance(){
  const recs = [];
  const emp = EMPLOYEES.filter(e=>true);
  const today = new Date();
  for(let back=6; back>=1; back--){
    const d = new Date(today); d.setDate(d.getDate()-back);
    const ds = fmtDate(d);
    const dow = d.getDay();
    emp.forEach(e=>{
      if(dow===0){ recs.push({id:uid("A"), empId:e.id, date:ds, status:"WEEK_OFF", checkIn:null, checkOut:null, remarks:"", createdBy:"SYSTEM", updatedBy:"SYSTEM", updatedAt:ds}); return; }
      const roll = Math.random();
      if(roll<0.06){ recs.push({id:uid("A"), empId:e.id, date:ds, status:"ABSENT", checkIn:null, checkOut:null, remarks:"", createdBy:"SYSTEM", updatedBy:"SYSTEM", updatedAt:ds}); }
      else if(roll<0.14){ recs.push({id:uid("A"), empId:e.id, date:ds, status:"LATE", checkIn:"09:"+pad(20+Math.floor(Math.random()*30)), checkOut:"18:"+pad(Math.floor(Math.random()*40)), remarks:"", createdBy:"SYSTEM", updatedBy:"SYSTEM", updatedAt:ds}); }
      else if(roll<0.18){ recs.push({id:uid("A"), empId:e.id, date:ds, status:"WFH", checkIn:"09:0"+Math.floor(Math.random()*5), checkOut:"18:0"+Math.floor(Math.random()*5), remarks:"", createdBy:"SYSTEM", updatedBy:"SYSTEM", updatedAt:ds}); }
      else if(roll<0.22){ recs.push({id:uid("A"), empId:e.id, date:ds, status:"ON_LEAVE", checkIn:null, checkOut:null, remarks:"", createdBy:"SYSTEM", updatedBy:"SYSTEM", updatedAt:ds}); }
      else { recs.push({id:uid("A"), empId:e.id, date:ds, status:"PRESENT", checkIn:"08:5"+Math.floor(Math.random()*9), checkOut:"18:0"+Math.floor(Math.random()*9), remarks:"", createdBy:"SYSTEM", updatedBy:"SYSTEM", updatedAt:ds}); }
    });
  }
  return recs;
}

// ---- Per-record attendance sync (avoids the whole-blob overwrite race) ----
// Each check-in/out writes to its OWN row in ams_attendance, keyed by
// empId_date, so two people punching in at the same moment never clobber
// each other's record the way a single shared JSON blob would.
async function upsertAttendanceRecord(rec){
  if(!useSupabase || !rec) return;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/ams_attendance`,{
      method:"POST",
      headers:{
        apikey:SUPABASE_ANON_KEY, Authorization:"Bearer "+SUPABASE_ANON_KEY,
        "Content-Type":"application/json", Prefer:"resolution=merge-duplicates"
      },
      body: JSON.stringify([{id: rec.empId+"_"+rec.date, emp_id:rec.empId, date:rec.date, data: rec}])
    });
    if(!res.ok){ console.error("Attendance record sync failed:", await res.text()); }
  }catch(e){ console.error("Attendance record sync error:", e); }
}
async function fetchAllAttendanceRecords(){
  if(!useSupabase) return null;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/ams_attendance?select=data`,{
      headers:{ apikey:SUPABASE_ANON_KEY, Authorization:"Bearer "+SUPABASE_ANON_KEY }
    });
    if(!res.ok) return null;
    const rows = await res.json();
    return rows.map(r=>r.data);
  }catch(e){ return null; }
}
async function seedAttendanceTableIfEmpty(records){
  if(!useSupabase || !records || !records.length) return;
  for(const rec of records){ await upsertAttendanceRecord(rec); }
}

async function loadState(){
  try{
    const res = await storageAdapter.get(STORAGE_KEY, true);
    if(res && res.value){
      state = JSON.parse(res.value);
      let needsSave=false;
      if(!state.settings){ state.settings = JSON.parse(JSON.stringify(DEFAULT_STATE.settings)); needsSave=true; }
      if(!state.settings.emailReport){ state.settings.emailReport = JSON.parse(JSON.stringify(DEFAULT_STATE.settings.emailReport)); needsSave=true; }
      if(needsSave) await saveState();
      await syncAttendanceFromTable();
      return;
    }
  }catch(e){
    if(e && e.message && e.message !== "not found"){
      lastStorageError = e.message;
      console.error("Attendance app storage error:", e);
    }
  }
  state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  await saveState();
  // First-time setup: push the seeded attendance rows into the dedicated table
  await seedAttendanceTableIfEmpty(state.attendance);
}
async function syncAttendanceFromTable(){
  const records = await fetchAllAttendanceRecords();
  if(records === null) return; // table not reachable or not using Supabase — keep whatever's in the blob
  if(records.length === 0 && state.attendance && state.attendance.length){
    // Table exists but is empty (e.g. freshly created) — seed it from the current blob once.
    await seedAttendanceTableIfEmpty(state.attendance);
    return;
  }
  state.attendance = records;
}
async function saveState(){
  try{
    await storageAdapter.set(STORAGE_KEY, JSON.stringify(state), true);
    storageAvailable = true;
    lastStorageError = "";
  }catch(e){
    storageAvailable = false;
    lastStorageError = e && e.message ? e.message : String(e);
    console.error("Attendance app storage error:", e);
  }
}

function showToast(msg){
  toastMsg = msg;

  let toastEl = document.getElementById("ams-toast-el");
  if(!toastEl || !root.contains(toastEl)){
    toastEl = document.createElement("div");
    toastEl.id = "ams-toast-el";
    toastEl.className = "toast";
    root.appendChild(toastEl);
  }
  toastEl.textContent = msg;
  toastTimer = setTimeout(()=>{
    toastMsg = null;
    const t = document.getElementById("ams-toast-el");
    if(t) t.remove();
  }, 2400);
}

function getCurrentPositionAsync(timeout){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){ reject(new Error("unsupported")); return; }
    navigator.geolocation.getCurrentPosition(resolve, reject, {enableHighAccuracy:true, timeout:timeout||8000});
  });
}
async function doCheckIn(locationLabel){
  const date = todayStr();
  let rec = attendanceFor(currentUser.id, date);
  if(rec && rec.checkIn){ showToast("Attendance already marked for this employee."); render(); return; }
  const shift = shiftById(currentUser.shiftId);
  const time = nowTimeStr().slice(0,5);
  let status = "PRESENT";
  if(shift){
    const graceEnd = addMinutesToTime(shift.start, shift.grace);
    if(time > graceEnd) status = "LATE";
  }
  if(rec){
    rec.checkIn = time; rec.status = status; rec.updatedBy=currentUser.name; rec.updatedAt=new Date().toISOString();
    if(locationLabel) rec.checkInLocation = locationLabel;
  } else {
    rec = {id:uid("A"), empId:currentUser.id, date, status, checkIn:time, checkOut:null, remarks:"", createdBy:currentUser.name, updatedBy:currentUser.name, updatedAt:new Date().toISOString(), checkInLocation:locationLabel||null};
    state.attendance.push(rec);
  }
  log(currentUser,"CHECK_IN",currentUser.id,"",time,"");
  await saveState();
  await upsertAttendanceRecord(rec);
  showToast("Checked in at "+niceTime(time)+(status==="LATE"?" — marked Late":""));
  render();
}
function addMinutesToTime(t,mins){
  const [h,m]=t.split(":").map(Number);
  const total=h*60+m+mins;
  return pad(Math.floor(total/60)%24)+":"+pad(total%60);
}
async function doCheckOut(locationLabel){
  const date = todayStr();
  let rec = attendanceFor(currentUser.id, date);
  if(!rec || !rec.checkIn){ showToast("Please check in first."); render(); return; }
  if(rec.checkOut){ showToast("Already checked out today."); render(); return; }
  const time = nowTimeStr().slice(0,5);
  if(time < rec.checkIn){ showToast("Check-out time cannot be earlier than check-in time."); render(); return; }
  rec.checkOut = time; rec.updatedBy=currentUser.name; rec.updatedAt=new Date().toISOString();
  if(locationLabel) rec.checkOutLocation = locationLabel;
  log(currentUser,"CHECK_OUT",currentUser.id,"",time,"");
  await saveState();
  await upsertAttendanceRecord(rec);
  showToast("Checked out at "+niceTime(time));
  render();
}

function geolocationErrorMessage(err){
  if(!window.isSecureContext){
    return "Location access requires a secure (HTTPS) connection. This page needs to be hosted over HTTPS for check-in/out to work.";
  }
  if(err && err.code===1){
    return "Location permission was denied. Please allow location access for this site in your browser settings, then try again.";
  }
  if(err && err.code===2){
    return "Your device couldn't determine its location right now. Please check your GPS/location settings and try again.";
  }
  if(err && err.code===3){
    return "Location detection timed out. Please make sure location services are on and try again.";
  }
  return "Couldn't get your location. Please enable location access and try again.";
}
function openConfirmPunch(mode){
  const token = uid("PUNCH");
  modal = {type:"confirm-punch", mode, token, lat:null, lng:null, address:null, loading:true, error:null};
  render();
  if(!navigator.geolocation){
    if(modal && modal.token===token){ modal.loading=false; modal.error="Location access isn't available on this device or browser."; render(); }
    return;
  }
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    if(!modal || modal.token!==token) return;
    modal.lat = pos.coords.latitude; modal.lng = pos.coords.longitude; modal.loading=false;
    render();
    try{
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${modal.lat}&lon=${modal.lng}&zoom=18&addressdetails=0`);
      const data = await res.json();
      if(modal && modal.token===token){ modal.address = (data && data.display_name) || null; render(); }
    }catch(e){ /* address stays null, coordinates still shown */ }
  }, (err)=>{
    if(modal && modal.token===token){ modal.loading=false; modal.error=geolocationErrorMessage(err); render(); }
  }, {enableHighAccuracy:true, timeout:15000});
}
async function confirmPunchNow(){
  if(!modal || modal.type!=="confirm-punch" || modal.lat===null) return false;
  let match = null;
  if(state.settings.locations.length){
    match = findMatchedLocation(modal.lat, modal.lng);
    if(!match || !match.within){
      showToast("Check-in/out isn't allowed — you're outside the approved location.");
      return false;
    }
  }
  const label = match ? match.loc.name : (modal.address || `${modal.lat.toFixed(5)}, ${modal.lng.toFixed(5)}`);
  const mode = modal.mode;
  modal = null;
  if(mode==="in") await doCheckIn(label); else await doCheckOut(label);
  return true;
}


async function saveAttendanceEdit(empId,date,newStatus,newIn,newOut,reason){
  if(isLocked(date)){ showToast("Attendance is locked."); return false; }
  if(!reason || !reason.trim()){ showToast("Please provide an edit reason."); return false; }
  if(newIn && newOut && newOut < newIn){ showToast("Check-out time cannot be earlier than check-in time."); return false; }
  let rec = attendanceFor(empId,date);
  const oldV = rec ? `${rec.status}/${rec.checkIn||"-"}/${rec.checkOut||"-"}` : "none";
  const newV = `${newStatus}/${newIn||"-"}/${newOut||"-"}`;
  if(rec){
    rec.status=newStatus; rec.checkIn=newIn||null; rec.checkOut=newOut||null;
    rec.updatedBy=currentUser.name; rec.updatedAt=new Date().toISOString(); rec.remarks=reason;
  } else {
    rec = {id:uid("A"), empId, date, status:newStatus, checkIn:newIn||null, checkOut:newOut||null, remarks:reason, createdBy:currentUser.name, updatedBy:currentUser.name, updatedAt:new Date().toISOString()};
    state.attendance.push(rec);
  }
  log(currentUser,"UPDATE",empId,oldV,newV,reason);
  await saveState();
  await upsertAttendanceRecord(rec);
  showToast("Attendance saved successfully.");
  return true;
}

async function applyBulk(status){
  if(bulkSelection.size===0){ showToast("Select at least one employee."); return; }
  const date = filters.bulkDate || todayStr();
  if(isLocked(date)){ showToast("Attendance is locked."); return; }
  const touchedRecs = [];
  bulkSelection.forEach(empId=>{
    let rec = attendanceFor(empId,date);
    const oldV = rec ? rec.status : "none";
    if(rec){ rec.status=status; rec.updatedBy=currentUser.name; rec.updatedAt=new Date().toISOString(); }
    else { rec = {id:uid("A"), empId, date, status, checkIn:null, checkOut:null, remarks:"Bulk update", createdBy:currentUser.name, updatedBy:currentUser.name, updatedAt:new Date().toISOString()}; state.attendance.push(rec); }
    touchedRecs.push(rec);
    log(currentUser,"BULK_UPDATE",empId,oldV,status,"Bulk update");
  });
  await saveState();
  for(const rec of touchedRecs){ await upsertAttendanceRecord(rec); }
  showToast("Updated attendance for "+bulkSelection.size+" employee(s).");
  bulkSelection = new Set();
  render();
}

async function applyLeave(empId,type,from,to,reason){
  if(!from||!to||from>to){ showToast("Please provide valid leave dates."); return; }
  const days = Math.round((new Date(to)-new Date(from))/864e5)+1;
  state.leaves.unshift({id:uid("L"), empId, type, from, to, days, reason, status:"PENDING", approvedBy:null, approvedAt:null});
  notify(empById(empId).name+" applied for "+type);
  await saveState();
  showToast("Leave request submitted.");
  render();
}
async function decideLeave(id,decision){
  const lv = state.leaves.find(l=>l.id===id);
  if(!lv) return;
  lv.status = decision; lv.approvedBy=currentUser.name; lv.approvedAt=new Date().toISOString();
  log(currentUser,"LEAVE_"+decision,lv.empId,"PENDING",decision,"");
  const touchedRecs = [];
  if(decision==="APPROVED"){
    let d = new Date(lv.from);
    const end = new Date(lv.to);
    while(d<=end){
      const ds = fmtDate(d);
      let rec = attendanceFor(lv.empId,ds);
      if(rec){ rec.status="ON_LEAVE"; }
      else { rec = {id:uid("A"),empId:lv.empId,date:ds,status:"ON_LEAVE",checkIn:null,checkOut:null,remarks:lv.type,createdBy:currentUser.name,updatedBy:currentUser.name,updatedAt:new Date().toISOString()}; state.attendance.push(rec); }
      touchedRecs.push(rec);
      d.setDate(d.getDate()+1);
    }
  }
  notify("Leave "+decision.toLowerCase()+" for "+empById(lv.empId).name);
  await saveState();
  for(const rec of touchedRecs){ await upsertAttendanceRecord(rec); }
  showToast("Leave "+decision.toLowerCase()+".");
  render();
}

  if(!c) return;
  c.status=decision; c.approvedBy=currentUser.name; c.approvedAt=new Date().toISOString();
  let touchedRec = null;
  if(decision==="APPROVED"){
    let rec = attendanceFor(c.empId,c.date);

    if(rec){ rec.checkIn=c.requestedCheckIn; }
    else { rec = {id:uid("A"),empId:c.empId,date:c.date,status:"PRESENT",checkIn:c.requestedCheckIn,checkOut:null,remarks:"Correction approved",createdBy:currentUser.name,updatedBy:currentUser.name,updatedAt:new Date().toISOString()}; state.attendance.push(rec); }
    touchedRec = rec;
    log(currentUser,"CORRECTION_APPROVED",c.empId,oldV,c.requestedCheckIn,c.reason);
  } else {
    log(currentUser,"CORRECTION_REJECTED",c.empId,"","",c.reason);
  }
  notify("Correction "+decision.toLowerCase()+" for "+empById(c.empId).name);
  await saveState();
  if(touchedRec) await upsertAttendanceRecord(touchedRec);
  showToast("Correction "+decision.toLowerCase()+".");
  render();
}

async function addShift(name,start,end,grace){

  await saveState(); showToast("Shift added."); render();
}

function exportCSV(rows, headers, filename){
  const lines = [headers.join(",")];
  rows.forEach(r=>{ lines.push(r.map(v=>`"${(v===null||v===undefined?"":v).toString().replace(/"/g,'""')}"`).join(",")); });
  const blob = new Blob([lines.join("\n")], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstChild; }

function statCounts(date){
  const emps = visibleEmployees();
  const counts = {PRESENT:0,ABSENT:0,LATE:0,ON_LEAVE:0,WFH:0,HALF_DAY:0,HOLIDAY:0,WEEK_OFF:0};
  let marked=0;
  emps.forEach(e=>{
    const rec = attendanceFor(e.id,date);
    if(rec){ counts[rec.status]=(counts[rec.status]||0)+1; marked++; }
  });
  const pct = emps.length? Math.round(((counts.PRESENT+counts.LATE+counts.WFH+counts.HALF_DAY*0.5) / emps.length)*100):0;
  return {counts, total:emps.length, pct};
}

function renderLogin(){
  root.innerHTML = "";
  const wrap = el(`<div class="login-wrap">
    <div class="login-card">
      <h1>Smart Attendance</h1>
      <div class="login-sub">Sign in with your Employee ID and department password.</div>
      <div class="field">
        <label>Employee ID</label>
        <input type="text" id="login-empid" placeholder="e.g. E5">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Your department's password">
      </div>
      <div id="login-error" class="login-error" style="display:none;"></div>
      <button class="login-go" id="login-go">Sign in</button>
    </div>
  </div>`);

  const idInput = wrap.querySelector("#login-empid");
  const pwInput = wrap.querySelector("#login-password");
  const errorBox = wrap.querySelector("#login-error");

  function attemptLogin(){
    const id = idInput.value.trim().toLowerCase();
    const pw = pwInput.value;
    if(!id){ errorBox.textContent="Please enter your Employee ID."; errorBox.style.display="block"; return; }
    if(!pw){ errorBox.textContent="Please enter your password."; errorBox.style.display="block"; return; }
    const match = state.employees.find(e=> e.id.toLowerCase()===id);
    if(!match){ errorBox.textContent="No account found for that Employee ID."; errorBox.style.display="block"; return; }
    if(match.status!=="Active"){ errorBox.textContent="This account has been disabled."; errorBox.style.display="block"; return; }
    const dept = deptById(match.deptId);
    const expected = match.password || (dept && dept.password);
    if(!expected || pw !== expected){ errorBox.textContent="Incorrect password."; errorBox.style.display="block"; return; }
    currentUser = match;
    currentView = "dashboard";
    try{ localStorage.setItem("ams-session-empid", match.id); }catch(e){}
    render();
  }
  wrap.querySelector("#login-go").addEventListener("click",attemptLogin);
  pwInput.addEventListener("keydown",e=>{ if(e.key==="Enter") attemptLogin(); });
  idInput.addEventListener("keydown",e=>{ if(e.key==="Enter") pwInput.focus(); });
  root.appendChild(wrap);
}

function navItemsFor(role){
  const base = [{k:"dashboard",l:"Dashboard"},{k:"attendance",l:"Attendance"},{k:"calendar",l:"Calendar"},{k:"leaves",l:"Leave"},{k:"corrections",l:"Corrections"}];
  if(role==="MANAGER"||role==="ADMIN"){ base.push({k:"reports",l:"Reports"}); }
  if(role==="ADMIN"){
    base.push({k:"employees",l:"Employees"});
    base.push({k:"departments",l:"Departments"});
    base.push({k:"shifts",l:"Shifts"});
    base.push({k:"access-settings",l:"Access Settings"});
    base.push({k:"email-reports",l:"Email Reports"});
    base.push({k:"audit",l:"Audit Logs"});
  }
  base.push({k:"notifications",l:"Notifications"});
  return base;
}

function findMatchedLocation(lat,lng){
  if(!state.settings.locations.length) return null;
  let best=null, bestDist=Infinity;
  state.settings.locations.forEach(loc=>{
    const d = distanceMeters(lat,lng,loc.lat,loc.lng);
    if(d<bestDist){ bestDist=d; best=loc; }
  });
  return {loc:best, distance:Math.round(bestDist), within: bestDist<=best.radius};
}

function niceDate(ds){
  const d = new Date(ds+"T00:00:00");
  return d.toLocaleDateString(undefined,{weekday:'short',year:'numeric',month:'short',day:'numeric'});
}

function renderAttendance(main){
  const isSelf = currentUser.role==="EMPLOYEE";
  pageHeader(main, "Attendance", isSelf? "Your attendance records" : "Team attendance records",
    currentUser.role!=="EMPLOYEE" ? `<button class="btn btn-brass" id="bulk-toggle">Bulk Update</button>` : "");

  const emps = visibleEmployees();
  const f = el(`<div class="filters">
    ${currentUser.role!=="EMPLOYEE" ? `<select id="f-emp"><option value="">All employees</option>${emps.map(e=>`<option value="${e.id}" ${filters.empId===e.id?'selected':''}>${e.name}</option>`).join("")}</select>` : ""}
    ${currentUser.role==="ADMIN" ? `<select id="f-dept"><option value="">All departments</option>${state.departments.map(d=>`<option value="${d.id}" ${filters.dept===d.id?'selected':''}>${d.name}</option>`).join("")}</select>` : ""}
    <select id="f-status"><option value="">All statuses</option>${STATUSES.map(s=>`<option value="${s}" ${filters.status===s?'selected':''}>${STATUS_LABEL[s]}</option>`).join("")}</select>
    <input type="date" id="f-from" value="${filters.from||""}">
    <input type="date" id="f-to" value="${filters.to||""}">
    <button class="btn btn-sm" id="f-reset">Reset Filters</button>
    <button class="btn btn-sm" id="f-export">Export Excel</button>
  </div>`);
  main.appendChild(f);
  f.querySelector("#f-status").addEventListener("change",e=>{ filters.status=e.target.value; render(); });
  f.querySelector("#f-from").addEventListener("change",e=>{ filters.from=e.target.value; render(); });
  f.querySelector("#f-to").addEventListener("change",e=>{ filters.to=e.target.value; render(); });
  f.querySelector("#f-reset").addEventListener("click",()=>{ filters={dept:"",status:"",from:"",to:"",empId:""}; render(); });
  const fe = f.querySelector("#f-emp"); if(fe) fe.addEventListener("change",e=>{ filters.empId=e.target.value; render(); });
  const fd = f.querySelector("#f-dept"); if(fd) fd.addEventListener("change",e=>{ filters.dept=e.target.value; render(); });

  let records = state.attendance.filter(a=>{
    const e = empById(a.empId); if(!e) return false;
    if(isSelf && a.empId!==currentUser.id) return false;
    if(!isSelf && currentUser.role==="MANAGER" && !(e.managerId===currentUser.id||e.id===currentUser.id)) return false;
    if(filters.empId && a.empId!==filters.empId) return false;
    if(filters.dept && e.deptId!==filters.dept) return false;
    if(filters.status && a.status!==filters.status) return false;
    if(filters.from && a.date<filters.from) return false;
    if(filters.to && a.date>filters.to) return false;
    return true;
  }).sort((a,b)=> b.date.localeCompare(a.date));

  f.querySelector("#f-export").addEventListener("click",()=>{
    exportCSV(records.map(r=>{
      const e=empById(r.empId);
      const wh = (r.checkIn&&r.checkOut)? fmtHM(minutesBetween(r.checkIn,r.checkOut)) : "-";
      return [e.id,e.name,deptById(e.deptId).name,r.date,r.checkIn||"-",r.checkOut||"-",wh,r.status,r.remarks||"",r.updatedBy,r.updatedAt];
    }), ["Employee ID","Employee Name","Department","Date","Check In","Check Out","Working Hours","Status","Remarks","Updated By","Updated Time"], "attendance_export.csv");
  });

  const bulkBtn = main.querySelector("#bulk-toggle");
  let bulkMode = false;
  if(bulkBtn) bulkBtn.addEventListener("click",()=>{ bulkMode=!bulkMode; renderBulkPanel(); });

  const bulkPanelHolder = el(`<div id="bulk-panel"></div>`);
  main.appendChild(bulkPanelHolder);
  function renderBulkPanel(){
    bulkPanelHolder.innerHTML="";
    if(!bulkMode) return;
    const empsByDept = {};
    emps.forEach(e=>{
      const key = e.deptId;
      if(!empsByDept[key]) empsByDept[key]=[];
      empsByDept[key].push(e);
    });
    const deptListHtml = state.departments
      .filter(d=>empsByDept[d.id] && empsByDept[d.id].length)
      .map(d=>`
        <div class="bulk-dept-group">
          <div class="bulk-dept-header">
            <label style="display:flex;align-items:center;gap:6px;font-weight:700;">
              <input type="checkbox" data-dept-select="${d.id}"> ${d.name} <span style="font-weight:400;color:var(--muted);">(${empsByDept[d.id].length})</span>
            </label>
          </div>
          ${empsByDept[d.id].map(e=>`<label style="display:flex;align-items:center;gap:8px;padding:4px 0 4px 22px;font-size:13px;"><input type="checkbox" data-emp="${e.id}" ${bulkSelection.has(e.id)?'checked':''}> ${e.name}</label>`).join("")}
        </div>
      `).join("");
    const panel = el(`<div class="card" style="margin-bottom:14px;">
      <div class="section-title">Bulk attendance update</div>
      <div class="filters">
        <input type="date" id="bulk-date" value="${todayStr()}">
        ${STATUSES.map(s=>`<button class="btn btn-sm" data-s="${s}">${STATUS_LABEL[s]}</button>`).join("")}
        <span style="color:var(--muted);font-size:12px;align-self:center;">${bulkSelection.size} selected</span>
      </div>
      <div style="max-height:260px;overflow:auto;">
        ${deptListHtml}
      </div>
    </div>`);
    panel.querySelector("#bulk-date").addEventListener("change",e=>{ filters.bulkDate=e.target.value; });
    panel.querySelectorAll("input[data-emp]").forEach(cb=>{
      cb.addEventListener("change",e=>{ const id=e.target.dataset.emp; if(e.target.checked) bulkSelection.add(id); else bulkSelection.delete(id); renderBulkPanel(); });
    });
    panel.querySelectorAll("input[data-dept-select]").forEach(cb=>{
      cb.addEventListener("change",e=>{
        const deptId = e.target.dataset.deptSelect;
        (empsByDept[deptId]||[]).forEach(emp=>{
          if(e.target.checked) bulkSelection.add(emp.id); else bulkSelection.delete(emp.id);
        });
        renderBulkPanel();
      });
    });
    panel.querySelectorAll("button[data-s]").forEach(b=>{
      b.addEventListener("click", async ()=>{
        if(!confirm(`Are you sure you want to update attendance for ${bulkSelection.size} employee(s) to ${STATUS_LABEL[b.dataset.s]}?`)) return;
        await applyBulk(b.dataset.s);
      });
    });
    bulkPanelHolder.appendChild(panel);
  }

  const tableCard = el(`<div class="card"></div>`);
  if(records.length===0){
    tableCard.appendChild(el(`<div class="empty">No attendance records match your filters.</div>`));
  } else {
    const t = el(`<table><thead><tr>
      <th>Employee</th><th>Department</th><th>Date</th><th>Check In</th><th>Check Out</th><th>Hours</th><th>Status</th>${currentUser.role!=="EMPLOYEE"?"<th></th>":""}
    </tr></thead><tbody></tbody></table>`);
    const tbody = t.querySelector("tbody");
    records.slice(0,150).forEach(r=>{
      const e = empById(r.empId);
      const wh = (r.checkIn && r.checkOut) ? fmtHM(minutesBetween(r.checkIn,r.checkOut)) : "—";
      const row = el(`<tr>
        <td>${e.name}</td><td>${deptById(e.deptId).name}</td><td>${r.date}${isLocked(r.date)?' 🔒':''}</td>
        <td>${niceTime(r.checkIn)}</td><td>${niceTime(r.checkOut)}</td><td>${wh}</td>
        <td><span class="pill pill-${r.status}">${STATUS_LABEL[r.status]}</span></td>
        ${currentUser.role!=="EMPLOYEE" ? `<td><button class="btn btn-sm edit-btn">Edit</button></td>` : ""}
      </tr>`);
      const editBtn = row.querySelector(".edit-btn");
      if(editBtn) editBtn.addEventListener("click",()=>{ modal={type:"edit-attendance", rec:r}; render(); });
      tbody.appendChild(row);
    });
    tableCard.appendChild(t);
  }
  main.appendChild(tableCard);
}

function renderCalendar(main){
  const emps = visibleEmployees();
  pageHeader(main,"Calendar","Monthly attendance view");
  const sel = el(`<div class="filters">
    ${currentUser.role!=="EMPLOYEE" ? `<select id="cal-emp">${emps.map(e=>`<option value="${e.id}">${e.name}</option>`).join("")}</select>` : ""}
    <button class="btn btn-sm" id="cal-prev">‹ Prev</button>
    <span style="align-self:center;font-weight:600;">${calMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</span>
    <button class="btn btn-sm" id="cal-next">Next ›</button>
  </div>`);
  main.appendChild(sel);
  let empId = currentUser.role==="EMPLOYEE" ? currentUser.id : (sel.querySelector("#cal-emp")?.value || emps[0]?.id);
  const ce = sel.querySelector("#cal-emp");
  if(ce) ce.addEventListener("change",e=>{ empId=e.target.value; renderCal(); });
  sel.querySelector("#cal-prev").addEventListener("click",()=>{ calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1); render(); });
  sel.querySelector("#cal-next").addEventListener("click",()=>{ calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1); render(); });

  const card = el(`<div class="card"></div>`);
  main.appendChild(card);
  const legend = el(`<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;font-size:11.5px;color:var(--muted);">
    ${STATUSES.map(s=>`<span style="display:flex;align-items:center;gap:5px;"><span style="width:9px;height:9px;border-radius:50%;background:var(--${s.toLowerCase().replace('_','')==='halfday'?'halfday':s.toLowerCase().replace('_','')});display:inline-block;"></span>${STATUS_LABEL[s]}</span>`).join("")}
  </div>`);
  card.appendChild(legend);
  const grid = el(`<div class="cal-grid"></div>`);
  card.appendChild(grid);
  function renderCal(){
    grid.innerHTML="";
    ["Su","Mo","Tu","We","Th","Fr","Sa"].forEach(d=>grid.appendChild(el(`<div class="cal-dow">${d}</div>`)));
    const first = new Date(calMonth.getFullYear(),calMonth.getMonth(),1);
    const startDow = first.getDay();
    const daysInMonth = new Date(calMonth.getFullYear(),calMonth.getMonth()+1,0).getDate();
    for(let i=0;i<startDow;i++) grid.appendChild(el(`<div class="cal-cell empty-cell"></div>`));
    for(let d=1; d<=daysInMonth; d++){

// ---------------- Location helpers ----------------
function distanceMeters(lat1,lng1,lat2,lng2){
  const R=6371000;
  const toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function withinAllowedLocation(lat,lng){
  if(!state.settings.locations.length) return true;
  return state.settings.locations.some(loc=> distanceMeters(lat,lng,loc.lat,loc.lng) <= loc.radius);
}

// ---------------- Daily Email Report ----------------
function padRight(str,len){ str=String(str); return str.length>=len ? str.slice(0,len-1)+" " : str+" ".repeat(len-str.length); }
function buildDailyReportSummary(){
  const {counts,total,pct} = statCounts(todayStr());
  const lines = [];
  lines.push(`ATTENDANCE SUMMARY REPORT`);
  lines.push(`Date: ${niceDate(todayStr())}`);
  lines.push("");
  lines.push(`Team Size: ${total}   |   Attendance: ${pct}%`);
  lines.push(`Present: ${counts.PRESENT}   Late: ${counts.LATE}   Absent: ${counts.ABSENT}   On Leave: ${counts.ON_LEAVE}   WFH: ${counts.WFH}`);
  lines.push("");
  lines.push("-".repeat(78));

  const activeEmployees = visibleEmployees();
  const cols = [
    {label:"Employee", width:20},
    {label:"Department", width:14},
    {label:"Status", width:12},
    {label:"Check In", width:11},
    {label:"Check Out", width:11},
  ];
  lines.push(cols.map(c=>padRight(c.label,c.width)).join(""));
  lines.push("-".repeat(78));
  activeEmployees.forEach(e=>{
    const rec = attendanceFor(e.id, todayStr());
    const dept = deptById(e.deptId);
    const row = [
      padRight(e.name, cols[0].width),
      padRight(dept?dept.name:"—", cols[1].width),
      padRight(rec?STATUS_LABEL[rec.status]:"No record", cols[2].width),
      padRight(rec&&rec.checkIn?niceTime(rec.checkIn):"—", cols[3].width),
      padRight(rec&&rec.checkOut?niceTime(rec.checkOut):"—", cols[4].width),
    ];
    lines.push(row.join(""));
  });
  lines.push("-".repeat(78));
  return lines.join("\n");
}
function openMailtoReport(){

  const url = `mailto:${encodeURIComponent(cfg.recipientEmail)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

    const actions = el(`<div class="modal-actions"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-primary" id="m-save">Save</button></div>`);
    box.appendChild(actions);
    box.querySelector("#m-cancel").addEventListener("click",()=>{ modal=null; render(); });
    box.querySelector("#m-save").addEventListener("click", async ()=>{
      const ok = await saveAttendanceEdit(r.empId,r.date, box.querySelector("#m-status").value, box.querySelector("#m-in").value, box.querySelector("#m-out").value, box.querySelector("#m-reason").value);
      if(ok){ modal=null; render(); } else { render(); }
    });
  }

  if(modal.type==="apply-leave"){
    box.innerHTML = `<h3>Apply for leave</h3>`;
    box.appendChild(el(`<div class="field"><label>Leave type</label><select id="l-type">${LEAVE_TYPES.map(t=>`<option>${t}</option>`).join("")}</select></div>`));
    box.appendChild(el(`<div class="field"><label>From</label><input type="date" id="l-from" value="${todayStr()}"></div>`));
    box.appendChild(el(`<div class="field"><label>To</label><input type="date" id="l-to" value="${todayStr()}"></div>`));
    box.appendChild(el(`<div class="field"><label>Reason</label><textarea id="l-reason" rows="2"></textarea></div>`));
    const actions = el(`<div class="modal-actions"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-primary" id="m-save">Submit</button></div>`);
    box.appendChild(actions);
    box.querySelector("#m-cancel").addEventListener("click",()=>{ modal=null; render(); });
    box.querySelector("#m-save").addEventListener("click", async ()=>{
      await applyLeave(currentUser.id, box.querySelector("#l-type").value, box.querySelector("#l-from").value, box.querySelector("#l-to").value, box.querySelector("#l-reason").value);
      modal=null;
    });
  }

  if(modal.type==="request-correction"){
    box.innerHTML = `<h3>Request attendance correction</h3>`;
    box.appendChild(el(`<div class="field"><label>Date</label><input type="date" id="c-date" value="${todayStr()}"></div>`));
    box.appendChild(el(`<div class="field"><label>Requested check-in time</label><input type="time" id="c-in"></div>`));
    box.appendChild(el(`<div class="field"><label>Reason</label><textarea id="c-reason" rows="2" placeholder="e.g. Forgot to punch attendance"></textarea></div>`));
    const actions = el(`<div class="modal-actions"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-primary" id="m-save">Submit</button></div>`);
    box.appendChild(actions);
    box.querySelector("#m-cancel").addEventListener("click",()=>{ modal=null; render(); });
    box.querySelector("#m-save").addEventListener("click", async ()=>{
      const date = box.querySelector("#c-date").value;
      const rec = attendanceFor(currentUser.id,date);
      await requestCorrection(currentUser.id,date, rec?rec.checkIn:null, box.querySelector("#c-in").value, box.querySelector("#c-reason").value);
      modal=null;
    });
  }

  if(modal.type==="employee-form"){
    const isEdit = !!modal.emp;
    const emp = modal.emp || {id:"",name:"",mobile:"",deptId:state.departments[0].id,designation:"",role:"EMPLOYEE",managerId:"",shiftId:state.shifts[0].id,joined:todayStr(),password:""};
    let photoDataUrl = emp.photo || null;
    box.innerHTML = `<h3>${isEdit?"Edit":"Add"} employee</h3>`;
    const photoField = el(`<div class="field">
      <label>Profile photo</label>
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="avatar-preview" id="e-photo-preview">${photoDataUrl?`<img src="${photoDataUrl}">`:`<span>${(emp.name||"?").trim().charAt(0).toUpperCase()||"?"}</span>`}</div>
        <input type="file" id="e-photo" accept="image/*">
      </div>
    </div>`);
    box.appendChild(photoField);
    photoField.querySelector("#e-photo").addEventListener("change", async (e)=>{
      const f = e.target.files[0];
      if(!f) return;
      try{
        photoDataUrl = await resizeImageFile(f,160);
        photoField.querySelector("#e-photo-preview").innerHTML = `<img src="${photoDataUrl}">`;
      }catch(err){ showToast("Couldn't load that image."); }
    });
    box.appendChild(el(`<div class="field"><label>Employee ID (Login ID)</label><input id="e-id" value="${emp.id}" ${isEdit?"disabled":""} placeholder="e.g. E9"></div>`));
    box.appendChild(el(`<div class="field"><label>Name</label><input id="e-name" value="${emp.name}"></div>`));
    box.appendChild(el(`<div class="field"><label>Mobile</label><input id="e-mobile" value="${emp.mobile}"></div>`));
    box.appendChild(el(`<div class="field"><label>Department</label><select id="e-dept">${state.departments.map(d=>`<option value="${d.id}" ${emp.deptId===d.id?'selected':''}>${d.name}</option>`).join("")}</select></div>`));
    box.appendChild(el(`<div class="field"><label>Designation</label><input id="e-desig" value="${emp.designation}"></div>`));
    box.appendChild(el(`<div class="field"><label>Role</label><select id="e-role">${["EMPLOYEE","MANAGER","ADMIN"].map(r=>`<option value="${r}" ${emp.role===r?'selected':''}>${r}</option>`).join("")}</select></div>`));
    box.appendChild(el(`<div class="field"><label>Shift</label><select id="e-shift">${state.shifts.map(s=>`<option value="${s.id}" ${emp.shiftId===s.id?'selected':''}>${s.name}</option>`).join("")}</select></div>`));
    box.appendChild(el(`<div class="field"><label>Joining date</label><input type="date" id="e-joined" value="${emp.joined}"></div>`));
    if(!isEdit){
      box.appendChild(el(`<div class="field"><label>Individual password (optional)</label><input id="e-pw" placeholder="Leave blank to use the department's shared password"></div>`));
    }
    const actions = el(`<div class="modal-actions"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-primary" id="m-save">${isEdit?"Save":"Add"}</button></div>`);
    box.appendChild(actions);
    box.querySelector("#m-cancel").addEventListener("click",()=>{ modal=null; render(); });
    box.querySelector("#m-save").addEventListener("click", async ()=>{
      const data = {
        name:box.querySelector("#e-name").value.trim(),
        mobile:box.querySelector("#e-mobile").value.trim(),
        deptId:box.querySelector("#e-dept").value,
        designation:box.querySelector("#e-desig").value.trim(),
        role:box.querySelector("#e-role").value,
        shiftId:box.querySelector("#e-shift").value,
        joined:box.querySelector("#e-joined").value,
        managerId: emp.managerId||null,
        photo: photoDataUrl,
      };
      if(!data.name){ showToast("Please provide required fields."); return; }
      if(isEdit){
        await updateEmployee(emp.id,data);
      } else {
        const newId = box.querySelector("#e-id").value.trim();
        if(!newId){ showToast("Please provide an Employee ID."); return; }
        if(empById(newId)){ showToast("That Employee ID is already in use."); return; }
        data.password = box.querySelector("#e-pw").value.trim() || null;
        await addEmployee(data,newId);
      }
      modal=null;
    });
  }

  if(modal.type==="dept-form"){
    box.innerHTML = `<h3>Add department</h3>`;
    box.appendChild(el(`<div class="field"><label>Name</label><input id="d-name"></div>`));
    box.appendChild(el(`<div class="field"><label>Manager</label><select id="d-mgr"><option value="">—</option>${state.employees.filter(e=>e.role==="MANAGER"||e.role==="ADMIN").map(e=>`<option value="${e.id}">${e.name}</option>`).join("")}</select></div>`));
    box.appendChild(el(`<div class="field"><label>Shared login password for this department</label><input id="d-pw" placeholder="e.g. Sales@123"></div>`));
    const actions = el(`<div class="modal-actions"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-primary" id="m-save">Add</button></div>`);
    box.appendChild(actions);
    box.querySelector("#m-cancel").addEventListener("click",()=>{ modal=null; render(); });
    box.querySelector("#m-save").addEventListener("click", async ()=>{
      const name = box.querySelector("#d-name").value.trim();
      const pw = box.querySelector("#d-pw").value.trim();
      if(!name || !pw){ showToast("Please provide required fields."); return; }
      await addDepartment(name, box.querySelector("#d-mgr").value||null, pw);
      modal=null;
    });
  }

  if(modal.type==="dept-password"){
    const d = modal.dept;
    box.innerHTML = `<h3>Change password — ${d.name}</h3>`;
    box.appendChild(el(`<div class="field"><label>New shared password</label><input id="dp-pw" value="${d.password||""}"></div>`));
    const actions = el(`<div class="modal-actions"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-primary" id="m-save">Save</button></div>`);
    box.appendChild(actions);
    box.querySelector("#m-cancel").addEventListener("click",()=>{ modal=null; render(); });
    box.querySelector("#m-save").addEventListener("click", async ()=>{
      const pw = box.querySelector("#dp-pw").value.trim();
      if(!pw){ showToast("Please provide a password."); return; }
      d.password = pw;
      log(currentUser,"DEPT_PASSWORD_CHANGE",d.id,"",d.name,"");
      await saveState();
      showToast("Password updated for "+d.name+".");
      modal=null;
      render();
    });
  }

  if(modal.type==="emp-password"){
    const e = modal.emp;
    const dept = deptById(e.deptId);
    box.innerHTML = `<h3>Change password — ${e.name}</h3>`;
    box.appendChild(el(`<div class="field"><label>Individual password</label><input id="ep-pw" value="${e.password||""}" placeholder="Leave blank to use the department's shared password (${dept?dept.password:'—'})"></div>`));
    const actions = el(`<div class="modal-actions">${e.password?'<button class="btn btn-danger" id="m-clear">Use department password</button>':''}<button class="btn" id="m-cancel">Cancel</button><button class="btn btn-primary" id="m-save">Save</button></div>`);
    box.appendChild(actions);
    box.querySelector("#m-cancel").addEventListener("click",()=>{ modal=null; render(); });
    const clearBtn = box.querySelector("#m-clear");
    if(clearBtn) clearBtn.addEventListener("click", async ()=>{
      e.password = null;
      log(currentUser,"EMP_PASSWORD_RESET",e.id,"","cleared — using department password","");
      await saveState();
      showToast(e.name+" now uses the department's shared password.");
      modal=null; render();
    });
    box.querySelector("#m-save").addEventListener("click", async ()=>{
      const pw = box.querySelector("#ep-pw").value.trim();
      if(!pw){ showToast("Please provide a password, or use \"Use department password\" instead."); return; }
      e.password = pw;
      log(currentUser,"EMP_PASSWORD_CHANGE",e.id,"","individual password set","");
      await saveState();
      showToast("Password updated for "+e.name+".");
      modal=null;
      render();
    });
  }

  if(modal.type==="shift-form"){
    box.innerHTML = `<h3>Add shift</h3>`;
    box.appendChild(el(`<div class="field"><label>Name</label><input id="s-name"></div>`));
    box.appendChild(el(`<div class="field"><label>Start</label><input type="time" id="s-start" value="09:00"></div>`));
    box.appendChild(el(`<div class="field"><label>End</label><input type="time" id="s-end" value="18:00"></div>`));
    box.appendChild(el(`<div class="field"><label>Grace period (minutes)</label><input type="number" id="s-grace" value="15"></div>`));
    const actions = el(`<div class="modal-actions"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-primary" id="m-save">Add</button></div>`);
    box.appendChild(actions);
    box.querySelector("#m-cancel").addEventListener("click",()=>{ modal=null; render(); });
    box.querySelector("#m-save").addEventListener("click", async ()=>{
      const name = box.querySelector("#s-name").value.trim();
      if(!name){ showToast("Please provide required fields."); return; }
      await addShift(name, box.querySelector("#s-start").value, box.querySelector("#s-end").value, box.querySelector("#s-grace").value);
      modal=null;
    });
  }

  if(modal.type==="location-form"){
    box.innerHTML = `<h3>Add approved location</h3>`;
    box.appendChild(el(`<div class="field"><label>Name</label><input id="loc-name" placeholder="e.g. Head Office"></div>`));
    box.appendChild(el(`<div class="field"><label>Latitude</label><input id="loc-lat" placeholder="e.g. 12.9716"></div>`));
    box.appendChild(el(`<div class="field"><label>Longitude</label><input id="loc-lng" placeholder="e.g. 77.5946"></div>`));
    box.appendChild(el(`<div class="field"><label>Radius (meters)</label><input id="loc-radius" value="500"></div>`));
    const useMine = el(`<button class="btn btn-sm" id="loc-mine" style="margin-bottom:14px;">📍 Use my current location</button>`);
    box.appendChild(useMine);
    useMine.addEventListener("click",()=>{
      if(!navigator.geolocation){ showToast("Location access isn't available on this device."); return; }
      navigator.geolocation.getCurrentPosition(pos=>{
        box.querySelector("#loc-lat").value = pos.coords.latitude.toFixed(6);
        box.querySelector("#loc-lng").value = pos.coords.longitude.toFixed(6);
        showToast("Current location filled in.");
      }, ()=>{ showToast("Couldn't get your location."); });
    });
    const actions = el(`<div class="modal-actions"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-primary" id="m-save">Add</button></div>`);
    box.appendChild(actions);
    box.querySelector("#m-cancel").addEventListener("click",()=>{ modal=null; render(); });
    box.querySelector("#m-save").addEventListener("click", async ()=>{
      const name = box.querySelector("#loc-name").value.trim();
      const lat = parseFloat(box.querySelector("#loc-lat").value);
      const lng = parseFloat(box.querySelector("#loc-lng").value);
      const radius = parseInt(box.querySelector("#loc-radius").value,10) || 500;
      if(!name || isNaN(lat) || isNaN(lng)){ showToast("Please provide a name, latitude, and longitude."); return; }
      state.settings.locations.push({id:uid("LOC"),name,lat,lng,radius});
      await saveState();
      showToast("Location added.");
      modal=null; render();
    });
  }

  document.body.appendChild(bg); // ensure overlay above artifact container too
  root.appendChild(bg);
}

// ---------------- Main render ----------------
function render(){
  if(!currentUser){ renderLogin(); return; }
  renderShell(main=>{
    if(currentView==="dashboard") renderDashboard(main);
    else if(currentView==="attendance") renderAttendance(main);
    else if(currentView==="calendar") renderCalendar(main);
    else if(currentView==="leaves") renderLeaves(main);
    else if(currentView==="corrections") renderCorrections(main);
    else if(currentView==="reports") renderReports(main);
    else if(currentView==="employees") renderEmployees(main);
    else if(currentView==="departments") renderDepartments(main);
    else if(currentView==="shifts") renderShifts(main);
    else if(currentView==="access-settings") renderAccessSettings(main);
    else if(currentView==="email-reports") renderEmailReports(main);
    else if(currentView==="audit") renderAudit(main);
    else if(currentView==="notifications") renderNotifications(main);
    else renderDashboard(main);
  });
}

async function refreshFromServer(){
  if(modal) return; // don't disrupt an open form
  if(!currentUser) return;
  try{
    const res = await storageAdapter.get(STORAGE_KEY, true);
    if(res && res.value){
      state = JSON.parse(res.value);
      storageAvailable = true;
      lastStorageError = "";
      await syncAttendanceFromTable();
      render();
    }
  }catch(e){ /* transient — keep showing current data */ }
}

(async function init(){
  root.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:600px;color:#6B7268;font-size:13px;">Loading…</div>`;
  await loadState();
  try{
    const savedId = localStorage.getItem("ams-session-empid");
    if(savedId){
      const match = empById(savedId);
      if(match && match.status==="Active"){ currentUser = match; currentView = "dashboard"; }
      else { localStorage.removeItem("ams-session-empid"); }
    }
  }catch(e){}
  render();
  setInterval(refreshFromServer, 15000);
  window.addEventListener("focus", refreshFromServer);
})();

})();
</script>
